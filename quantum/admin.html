<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quantum — Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f2f2f5;--surface:#ffffff;--surface-alt:#e8e8ee;--border:rgba(0,0,0,0.06);--text:#1a1a1e;--text-muted:#7a7a82;--accent:#0071e3;--accent2:#5856d6;--shadow:0 8px 32px rgba(0,0,0,0.04);--red:#ff3b30;--green:#2d8a4e;--gold:#c97d20;}
[data-theme="dark"]{--bg:#0a0a0d;--surface:#141416;--surface-alt:#1c1c20;--border:rgba(255,255,255,0.06);--text:#f0f0f2;--text-muted:#6a6a72;--accent:#2997ff;--accent2:#7a7aff;--shadow:0 8px 32px rgba(0,0,0,0.4);}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;transition:background 0.3s,color 0.3s;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--surface-alt);}::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:2px;}
.login-screen{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.login-screen.hidden{display:none;}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.5rem;width:360px;max-width:90vw;}
.login-box h1{font-size:1.4rem;font-weight:800;text-align:center;margin-bottom:0.2rem;}.login-box h1 .q{color:var(--accent);}
.login-box p{text-align:center;color:var(--text-muted);font-size:0.8rem;margin-bottom:1.5rem;}
.login-box input{width:100%;padding:0.6rem 0.8rem;background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:10px;font-size:0.85rem;font-family:inherit;outline:none;margin-bottom:0.8rem;}
.login-box input:focus{border-color:var(--accent);}
.login-box button{width:100%;padding:0.6rem;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:600;font-size:0.85rem;cursor:pointer;font-family:inherit;}
.login-box .error{color:var(--red);font-size:0.75rem;text-align:center;margin-top:0.5rem;display:none;}
.theme-btn{position:fixed;top:1rem;right:1rem;z-index:999;background:var(--surface);border:1px solid var(--border);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}
.sidebar{width:220px;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.5rem 1rem;position:fixed;left:0;top:0;}
.sidebar .logo{font-size:1.2rem;font-weight:800;}.sidebar .logo .q{color:var(--accent);}
.sidebar .sub{font-size:0.6rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:2rem;}
.sidebar nav{display:flex;flex-direction:column;gap:0.3rem;}
.sidebar nav a{display:flex;align-items:center;gap:0.6rem;padding:0.6rem 0.8rem;border-radius:10px;color:var(--text-muted);text-decoration:none;font-size:0.8rem;font-weight:500;transition:all 0.3s;}
.sidebar nav a:hover{background:var(--surface-alt);color:var(--text);}
.sidebar nav a.active{background:rgba(0,113,227,0.08);border:1px solid rgba(0,113,227,0.15);color:var(--accent);}
.sidebar .back-link{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border);}
.sidebar .back-link a{display:flex;align-items:center;gap:0.4rem;color:var(--text-muted);text-decoration:none;font-size:0.75rem;padding:0.5rem 0.8rem;border-radius:10px;}
.sidebar .back-link a:hover{background:var(--surface-alt);color:var(--text);}
.main{margin-left:220px;flex:1;padding:1.5rem 2rem;}
.page{display:none;}.page.active{display:block;}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:0.5rem;}
header h1{font-size:1.2rem;font-weight:700;}
header .user{display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;color:var(--text-muted);}
header .user .logout{padding:0.3rem 0.7rem;background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:8px;cursor:pointer;font-size:0.7rem;font-family:inherit;transition:all 0.3s;}
header .user .logout:hover{border-color:var(--red);color:var(--red);}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:1.5rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.2rem;}
.stat-card .stat-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:0.3rem;}
.stat-card .stat-value{font-size:1.8rem;font-weight:800;color:var(--accent);letter-spacing:-1px;}
.stat-card .stat-sub{font-size:0.7rem;color:var(--text-muted);margin-top:0.2rem;}
.recent-activity{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.2rem;margin-bottom:1.5rem;}
.recent-activity h3{font-size:0.9rem;font-weight:600;margin-bottom:0.8rem;}
.activity-item{display:flex;align-items:center;gap:0.8rem;padding:0.5rem 0;border-bottom:1px solid var(--border);font-size:0.78rem;}
.activity-item:last-child{border-bottom:none;}
.activity-item .time{color:var(--text-muted);font-size:0.65rem;margin-left:auto;white-space:nowrap;}
.table-container{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:1.5rem;}
.table-header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:0.5rem;}
.table-header h3{font-size:0.9rem;font-weight:600;}
.table-header .search-box{display:flex;gap:0.4rem;flex-wrap:wrap;align-items:center;}
.table-header .search-box input{padding:0.4rem 0.7rem;background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:0.75rem;font-family:inherit;outline:none;width:180px;}
.table-header .search-box select{padding:0.4rem 0.5rem;background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:0.72rem;font-family:inherit;outline:none;}
.table-header .notif-badge{background:var(--accent);color:#fff;font-size:0.5rem;padding:0.05rem 0.3rem;border-radius:3px;margin-left:0.3rem;}
table{width:100%;border-collapse:collapse;}
th,td{padding:0.7rem 1rem;text-align:left;font-size:0.78rem;border-bottom:1px solid var(--border);}
th{font-size:0.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);font-weight:600;}
.action-btn{padding:0.25rem 0.5rem;background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;cursor:pointer;font-size:0.65rem;font-family:inherit;transition:all 0.3s;}
.action-btn:hover{background:var(--surface-alt);}
.action-btn.danger:hover{color:var(--red);border-color:var(--red);}
.export-btn{padding:0.4rem 0.8rem;background:var(--surface-alt);border:1px solid var(--border);color:var(--text-muted);border-radius:8px;cursor:pointer;font-size:0.65rem;font-family:inherit;transition:all 0.3s;}
.export-btn:hover{border-color:var(--accent);color:var(--accent);}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;margin-bottom:1.5rem;}
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all 0.3s;}
.prod-card:hover{border-color:var(--accent);}
.prod-card .pc-img{height:110px;background-size:cover;background-position:center;}
.prod-card .pc-body{padding:0.8rem;}
.prod-card .pc-body h4{font-size:0.85rem;font-weight:600;}
.prod-card .pc-body .pc-meta{display:flex;justify-content:space-between;font-size:0.7rem;color:var(--text-muted);margin:0.2rem 0;}
.prod-card .pc-body .pc-actions{display:flex;gap:0.4rem;margin-top:0.5rem;}
.prod-card .pc-body .pc-actions button{flex:1;padding:0.3rem;border:none;border-radius:6px;cursor:pointer;font-size:0.65rem;font-weight:500;font-family:inherit;transition:all 0.3s;}
.prod-card .pc-body .pc-actions .edit-btn{background:var(--surface-alt);color:var(--accent);border:1px solid var(--border);}
.prod-card .pc-body .pc-actions .del-btn{background:transparent;color:var(--red);border:1px solid var(--red);}
.chart-container{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:1.5rem;}
.chart-container h3{font-size:0.9rem;font-weight:600;margin-bottom:0.5rem;}
.chart-container canvas{width:100%!important;height:180px!important;}
.modal-overlay{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;padding:1rem;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.5rem;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;transform:scale(0.9);transition:transform 0.3s;}
.modal-overlay.open .modal{transform:scale(1);}
.modal h2{font-size:1rem;font-weight:700;margin-bottom:1rem;}
.modal .form-group{margin-bottom:0.8rem;}
.modal .form-group label{display:block;font-size:0.65rem;color:var(--text-muted);margin-bottom:0.2rem;text-transform:uppercase;letter-spacing:1px;}
.modal .form-group input,.modal .form-group select,.modal .form-group textarea{width:100%;padding:0.5rem 0.7rem;background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:0.8rem;font-family:inherit;outline:none;}
.modal .form-group input:focus,.modal .form-group select:focus,.modal .form-group textarea:focus{border-color:var(--accent);}
.modal .form-row{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;}
.modal .modal-actions{display:flex;gap:0.5rem;margin-top:1rem;}
.modal .modal-actions button{flex:1;padding:0.5rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:0.8rem;font-family:inherit;transition:all 0.3s;}
.modal .modal-actions .save-btn{background:var(--accent);color:#fff;border:none;}
.modal .modal-actions .cancel-btn{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
.add-btn{padding:0.5rem 1.2rem;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:0.8rem;font-family:inherit;margin-bottom:1rem;display:inline-flex;align-items:center;gap:0.4rem;}
.add-btn:hover{box-shadow:0 8px 20px rgba(0,113,227,0.25);}
.toast{position:fixed;bottom:2rem;right:2rem;z-index:999;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.7rem 1rem;box-shadow:var(--shadow);backdrop-filter:blur(20px);transform:translateY(120px);opacity:0;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;}
.toast.show{transform:translateY(0);opacity:1;}
@media(max-width:900px){
header h1{font-size:1rem;}
}
@media(max-width:768px){
.sidebar{width:60px;padding:1rem 0.5rem;}
.sidebar nav a span,.sidebar .back-link a span,.sidebar .sub{display:none;}
.sidebar nav a,.sidebar .back-link a{justify-content:center;padding:0.5rem;font-size:1rem;}
.main{margin-left:60px;padding:1rem;}
.stats-grid{grid-template-columns:repeat(2,1fr);gap:0.8rem;}
.stat-card{padding:0.8rem;}
.stat-card .stat-value{font-size:1.3rem;}
.table-header{flex-direction:column;align-items:stretch;}
.table-header .search-box{flex-direction:column;}
.table-header .search-box input{width:100%;}
table{font-size:0.7rem;}
th,td{padding:0.5rem 0.6rem;}
.modal .form-row{grid-template-columns:1fr;}
.modal{padding:1.2rem;}
.chart-container canvas{height:150px!important;}
.products-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.8rem;}
.prod-card .pc-img{height:90px;}
.prod-card .pc-body{padding:0.6rem;}
.export-btn{width:100%;text-align:center;}
.add-btn{width:100%;justify-content:center;}
.toast{right:1rem;bottom:1rem;left:1rem;font-size:0.72rem;}
}
@media(max-width:480px){
.sidebar{width:48px;padding:0.8rem 0.3rem;}
.main{margin-left:48px;padding:0.8rem;}
.stats-grid{grid-template-columns:1fr;}
.stat-card .stat-value{font-size:1.2rem;}
th,td{padding:0.4rem;font-size:0.65rem;}
.products-grid{grid-template-columns:1fr 1fr;gap:0.6rem;}
.prod-card .pc-body h4{font-size:0.75rem;}
.prod-card .pc-body .pc-meta{font-size:0.6rem;}
.chart-container{overflow-x:auto;}
.chart-container canvas{min-width:300px;}
}
@media(max-width:375px){
.products-grid{grid-template-columns:1fr;}
.stats-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen"><div class="login-box"><h1><span class="q">Q</span>uantum</h1><p>Admin Dashboard</p><input type="password" id="loginPass" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')adminLogin()"><button onclick="adminLogin()">🔐 Connexion</button><div class="error" id="loginError">Mot de passe incorrect (utilisez: admin123)</div></div></div>
<button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
<aside class="sidebar"><div class="logo"><span class="q">Q</span>uantum</div><div class="sub">Admin Panel</div>
<nav><a href="#" class="active" onclick="showPage('dashboard',this)"><span>📊</span> <span>Dashboard</span></a><a href="#" onclick="showPage('orders',this)"><span>📦</span> <span>Commandes</span></a><a href="#" onclick="showPage('products',this)"><span>💻</span> <span>Produits</span> <span class="notif-badge" id="stockNotifCount">0</span></a><a href="#" onclick="showPage('analytics',this)"><span>📈</span> <span>Analytiques</span></a></nav>
<div class="back-link"><a href="index.html"><span>←</span> <span>Retour site</span></a></div></aside>
<div class="main">
<header><h1 id="pageTitle">📊 Dashboard</h1><div class="user"><span>Admin</span><button class="logout" onclick="adminLogout()">Déconnexion</button></div></header>
<div class="page active" id="page-dashboard"><div class="stats-grid" id="dashStats"></div><div class="chart-container"><h3>📈 Revenus (7 jours)</h3><canvas id="revenueChart"></canvas></div><div class="chart-container"><h3>📊 Ventes par Catégorie</h3><canvas id="categoryChart"></canvas></div><div class="recent-activity"><h3>⚡ Activité Récente</h3><div id="activityFeed"></div></div></div>
<div class="page" id="page-orders"><div class="table-container"><div class="table-header"><h3>📦 Commandes <span class="notif-badge" id="orderCount">0</span></h3><div class="search-box"><select id="orderStatusFilter" onchange="renderOrders()"><option value="all">Tous</option><option value="pending">En attente</option><option value="confirmed">Confirmée</option><option value="shipped">Expédiée</option><option value="delivered">Livrée</option><option value="cancelled">Annulée</option></select><input type="text" id="orderSearch" placeholder="Rechercher..." oninput="renderOrders()"><button class="export-btn" onclick="exportOrders()">📥 CSV</button></div></div><table id="ordersTable"></table></div></div>
<div class="page" id="page-products">
<button class="add-btn" onclick="openProductModal()">+ Ajouter Produit</button>
<button class="export-btn" onclick="exportProductsCSV()" style="margin-left:0.5rem;">📥 CSV</button>
<div class="products-grid" id="productsGrid"></div>
</div>
<div class="page" id="page-analytics"><div class="stats-grid" id="analyticsStats"></div><div class="recent-activity"><h3>👥 Insights Clients</h3><div id="customerInsights"></div></div></div>
</div>

<div class="modal-overlay" id="productModal">
<div class="modal"><h2 id="modalTitle">Ajouter un Produit</h2>
<div class="form-row"><div class="form-group"><label>Nom</label><input type="text" id="pName"></div><div class="form-group"><label>Prix (د.ج)</label><input type="number" id="pPrice"></div></div>
<div class="form-row"><div class="form-group"><label>Catégorie</label><select id="pTab"><option value="laptops">PC Portables</option><option value="phones">Téléphones</option><option value="audio">Audio</option></select></div><div class="form-group"><label>Usage</label><select id="pCat"><option value="student">Student</option><option value="business">Business</option><option value="gaming">Gaming</option><option value="creator">Creator</option></select></div></div>
<div class="form-row"><div class="form-group"><label>Stock</label><input type="number" id="pStock"></div><div class="form-group"><label>Note</label><input type="number" id="pRating" value="4.5" min="1" max="5" step="0.1"></div></div>
<div class="form-group"><label>Image URL</label><input type="text" id="pImg" placeholder="https://images.unsplash.com/photo-..."></div>
<div class="form-group"><label>Spécifications (séparées par ,)</label><input type="text" id="pSpecs" placeholder="M4, 16GB, 512GB"></div>
<div class="form-group"><label>Description</label><textarea id="pDesc" rows="2">Description du produit</textarea></div>
<div class="form-row"><div class="form-group"><label>CPU</label><input type="text" id="pCpu" placeholder="M4"></div><div class="form-group"><label>Batterie</label><input type="text" id="pBattery" placeholder="18h"></div></div>
<div class="form-row"><div class="form-group"><label>Garantie (ans)</label><input type="number" id="pWarranty" value="1"></div><div class="form-group"><label>Couleurs</label><input type="text" id="pColors" placeholder="Argent, Gris, Noir"></div></div>
<div class="modal-actions"><button class="save-btn" onclick="saveProduct()">💾 Enregistrer</button><button class="cancel-btn" onclick="closeProductModal()">Annuler</button></div>
</div></div>

<div class="modal-overlay" id="orderDetailModal"><div class="modal" style="max-width:500px;text-align:left;" id="orderDetailContent"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
const ADMIN_PASS='admin123';let editingId=null;let activityLog=JSON.parse(localStorage.getItem('qn_activity'))||[];
function adminLogin(){const p=document.getElementById('loginPass').value;if(p===ADMIN_PASS){document.getElementById('loginScreen').classList.add('hidden');localStorage.setItem('qn_admin','logged');initDashboard();}else{document.getElementById('loginError').style.display='block';}}
function adminLogout(){localStorage.removeItem('qn_admin');document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('loginPass').value='';}
if(localStorage.getItem('qn_admin')==='logged'){document.getElementById('loginScreen').classList.add('hidden');initDashboard();}
function toggleTheme(){const h=document.documentElement;const b=document.getElementById('themeBtn');if(h.getAttribute('data-theme')==='dark'){h.removeAttribute('data-theme');b.textContent='🌙';}else{h.setAttribute('data-theme','dark');b.textContent='☀️';}}
function showPage(p,el){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.sidebar nav a').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');if(el)el.classList.add('active');const titles={dashboard:'📊 Dashboard',orders:'📦 Commandes',products:'💻 Produits',analytics:'📈 Analytiques'};document.getElementById('pageTitle').textContent=titles[p]||p;if(p==='dashboard')renderDashboard();if(p==='orders')renderOrders();if(p==='products')renderProducts();if(p==='analytics')renderAnalytics();}
function fmtDZD(n){return Math.round(n).toLocaleString('fr-DZ')+' د.ج';}
function logActivity(icon,msg,color='accent'){const t=new Date().toLocaleString('fr-DZ',{hour:'2-digit',minute:'2-digit'});activityLog.unshift({icon,msg,t,color});if(activityLog.length>30)activityLog.pop();localStorage.setItem('qn_activity',JSON.stringify(activityLog));renderActivity();}
function renderActivity(){const el=document.getElementById('activityFeed');if(!el)return;el.innerHTML=!activityLog.length?'<div style="color:var(--text-muted);font-size:0.78rem;">Aucune activité</div>':activityLog.map(a=>`<div class="activity-item"><span>${a.icon} ${a.msg}</span><span class="time">${a.t}</span></div>`).join('');}
function viewOrder(id){
const orders=getOrders();const o=orders.find(x=>x.id===id);if(!o)return;
const itemsHtml=o.items?.map(i=>'<tr><td style="padding:0.3rem 0;font-size:0.72rem;">'+i.name+'</td><td style="padding:0.3rem 0;font-size:0.72rem;text-align:center;">x'+i.qty+'</td><td style="padding:0.3rem 0;font-size:0.72rem;color:var(--accent);text-align:right;">'+fmtDZD(i.price*i.qty)+'</td></tr>').join('')||'<tr><td colspan="3">—</td></tr>';
document.getElementById('orderDetailContent').innerHTML='<button class="close-icon" style="float:right;background:none;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer;" onclick="document.getElementById(\'orderDetailModal\').classList.remove(\'open\')">✕</button><h2 style="font-size:0.95rem;font-weight:700;margin-bottom:0.5rem;">📦 Commande '+o.id+'</h2><div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:0.8rem;"><p>📅 '+new Date(o.date).toLocaleDateString('fr-DZ')+'</p><p>👤 <strong>'+(o.name||'Client')+'</strong></p><p>📞 '+(o.phone||'—')+'</p><p>📍 '+(o.wilaya||'')+' • '+(o.address||'')+'</p><p>💳 '+(o.payment||'À la livraison')+'</p></div><hr style="border:none;border-top:1px solid var(--border);margin:0.3rem 0;"><h3 style="font-size:0.75rem;font-weight:600;margin:0.5rem 0;">Articles</h3><table style="width:100%;border-collapse:collapse;"><tr><th style="text-align:left;font-size:0.6rem;padding:0.2rem 0;">Produit</th><th style="text-align:center;font-size:0.6rem;padding:0.2rem 0;">Qté</th><th style="text-align:right;font-size:0.6rem;padding:0.2rem 0;">Prix</th></tr>'+itemsHtml+'<tr><td colspan="2" style="padding:0.3rem 0;font-size:0.72rem;"><strong>Total</strong></td><td style="padding:0.3rem 0;font-size:0.72rem;color:var(--accent);font-weight:700;text-align:right;">'+fmtDZD(o.total||0)+'</td></tr></table><div style="margin-top:0.8rem;"><button class="action-btn" onclick="addOrderToCart(\''+o.id+'\')" style="padding:0.4rem 0.8rem;width:100%;background:rgba(0,113,227,0.1);border:1px solid var(--accent);color:var(--accent);border-radius:8px;cursor:pointer;font-size:0.7rem;font-weight:600;">🛒 Ajouter au Panier (Admin)</button></div>';
document.getElementById('orderDetailModal').classList.add('open');
}
function addOrderToCart(id){
const orders=getOrders();const o=orders.find(x=>x.id===id);if(!o)return;
const cart=JSON.parse(localStorage.getItem('qn_cart')||'[]');
o.items?.forEach(item=>{const ex=cart.find(x=>x.name===item.name);if(ex)ex.qty=(ex.qty||1)+(item.qty||1);else cart.push({id:Date.now()+Math.random(),name:item.name,price:item.price,qty:item.qty||1,tab:'admin',stock:99});});
localStorage.setItem('qn_cart',JSON.stringify(cart));
showToast('🛒','Articles ajoutés au panier (voir le site)');
document.getElementById('orderDetailModal').classList.remove('open');
}

function showToast(i,m){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=`${i} ${m}`;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

/* Orders */
function getOrders(){return JSON.parse(localStorage.getItem('qn_orders')||'[]');}
function saveOrders(o){localStorage.setItem('qn_orders',JSON.stringify(o));}
function renderOrders(){const orders=getOrders();const filter=document.getElementById('orderStatusFilter').value;const search=document.getElementById('orderSearch').value.toLowerCase();let f=orders;if(filter!=='all')f=f.filter(o=>o.status===filter);if(search)f=f.filter(o=>o.id?.toLowerCase().includes(search)||o.items?.some(i=>i.name?.toLowerCase().includes(search)));document.getElementById('orderCount').textContent=orders.length||'0';
const table=document.getElementById('ordersTable');if(!f.length){table.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:2rem;">Aucune commande</td></tr>';return;}
table.innerHTML=`<tr><th>Réf</th><th>Date</th><th>Articles</th><th>Total</th><th>Statut</th><th>Action</th></tr>`+f.map(o=>{const s=o.status||'pending';const statusLabel={pending:'⏳ Attente',confirmed:'✓ Confirmée',shipped:'🚚 Expédiée',delivered:'✅ Livrée',cancelled:'❌ Annulée'};const statusColors={pending:'var(--gold)',confirmed:'var(--accent)',shipped:'var(--green)',delivered:'var(--accent2)',cancelled:'var(--red)'};return`<tr><td style="font-weight:600;font-size:0.7rem;">${o.id}</td><td style="font-size:0.72rem;">${o.date?new Date(o.date).toLocaleDateString('fr-DZ'):'—'}</td><td style="font-size:0.72rem;max-width:200px;overflow:hidden;text-overflow:ellipsis;">${(o.items||[]).map(i=>i.name).join(', ')}</td><td style="font-weight:600;color:var(--accent);">${fmtDZD(o.total||0)}</td><td><span style="display:inline-flex;padding:0.15rem 0.5rem;border-radius:6px;font-size:0.65rem;font-weight:600;background:${s===statusColors[s]?'rgba(0,113,227,0.1)':'rgba(201,125,32,0.1)'};color:${statusColors[s]||'var(--text-muted)'};">${statusLabel[s]||s}</span></td><td><select class="action-btn" onchange="updateStatus('${o.id}',this.value)" title="Changer statut"><option value="">...</option><option value="confirmed">✓ Confirmer</option><option value="shipped">🚚 Expédier</option><option value="delivered">✅ Livrer</option><option value="cancelled">❌ Annuler</option></select><button class="action-btn" onclick="viewOrder('${o.id}')" style="margin-left:0.3rem;">👁️</button></td></tr>`;}).join('');}
function updateStatus(id,s){if(!s)return;const o=getOrders();const i=o.findIndex(x=>x.id===id);if(i===-1)return;o[i].status=s;saveOrders(o);logActivity('📦',`${id} → ${s}`);renderOrders();showToast('✅','Statut mis à jour');}
function exportOrders(){const o=getOrders();let c='Réf,Date,Articles,Total,Statut\\n';o.forEach(x=>{c+=`${x.id},${x.date?new Date(x.date).toLocaleDateString('fr-DZ'):''},"${(x.items||[]).map(i=>i.name).join(', ')}",${x.total},${x.status}\\n`;});downloadCSV(c,'commandes_qn.csv');showToast('📥','Exporté');}

/* Product CRUD */
function getProducts(){const s=JSON.parse(localStorage.getItem('qn_products')||'null');if(s&&s.length)return s;return getDefaultProducts();}
function getDefaultProducts(){return[
{id:1,name:'QuantumBook Pro 16"',tab:'laptops',price:495000,img:'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=400&h=300&fit=crop',specs:['M4 Pro','24GB','512GB'],tag:'new',stock:10,warranty:2,desc:'Le portable le plus puissant.',colors:['Argent','Gris Sidéral'],rating:4.8,cpu:'M4 Pro',battery:'22h',cat:'creator'},
{id:2,name:'QuantumBook Air 13"',tab:'laptops',price:365000,img:'https://images.unsplash.com/photo-1531297484001-80022131f5a1?w=400&h=300&fit=crop',specs:['M4','16GB','256GB'],tag:null,stock:15,warranty:1,desc:'Ultra-portable puissant.',colors:['Argent','Gris Sidéral','Or Rose'],rating:4.7,cpu:'M4',battery:'18h',cat:'student'},
{id:3,name:'QuantumPhone 15 Pro',tab:'phones',price:225000,img:'https://images.unsplash.com/photo-1511707171634-5f897ff02bb9?w=400&h=300&fit=crop',specs:['6.7" OLED','256GB','48MP'],tag:'best',stock:8,warranty:2,desc:'Appareil photo 48MP.',colors:['Titane','Argent','Nuit'],rating:4.9,cpu:'A17 Pro',battery:'28h',cat:'gaming'},
{id:4,name:'QuantumPhone 15',tab:'phones',price:165000,img:'https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400&h=300&fit=crop',specs:['6.1" OLED','128GB','Dual Camera'],tag:null,stock:20,warranty:1,desc:'Meilleur rapport Q/P.',colors:['Argent','Bleu','Vert','Rose'],rating:4.6,cpu:'A16',battery:'24h',cat:'student'},
{id:5,name:'QuantumPods Pro',tab:'audio',price:52000,img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&h=300&fit=crop',specs:['ANC','Spatial Audio','IPX4'],tag:'new',stock:25,warranty:1,desc:'Réduction de bruit active.',colors:['Blanc','Noir'],rating:4.5,cat:'business'},
{id:6,name:'QuantumPods Max',tab:'audio',price:115000,img:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=400&h=300&fit=crop',specs:['Over-ear','Hi-Res','ANC'],tag:null,stock:12,warranty:1,desc:'Casque audio haut de gamme.',colors:['Argent','Espace','Bleu','Rose'],rating:4.7,cat:'creator'},
];}
function saveProducts(p){localStorage.setItem('qn_products',JSON.stringify(p));}
function renderProducts(){const prods=getProducts();const grid=document.getElementById('productsGrid');let low=0;prods.forEach(p=>{if(p.stock<=5&&p.stock>0)low++;});document.getElementById('stockNotifCount').textContent=low||'0';
if(!prods.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-muted)">Aucun produit</div>';return;}
grid.innerHTML=prods.map(p=>{const alert=p.stock<=5&&p.stock>0?`<div style="font-size:0.55rem;color:var(--red);margin-top:0.2rem;">⚠️ Stock bas (${p.stock})</div>`:'';return`<div class="prod-card"><div class="pc-img" style="background-image:url('${p.img}')"></div><div class="pc-body"><h4>${p.name}</h4><div class="pc-meta"><span>${p.tab} • ${p.cat}</span><span style="color:var(--accent);font-weight:600;">${fmtDZD(p.price)}</span></div><div class="pc-meta"><span>Stock: ${p.stock}</span><span>⭐ ${p.rating}/5</span></div>${alert}<div class="pc-actions"><button class="edit-btn" onclick="editProduct(${p.id})">✏️</button><button class="del-btn" onclick="deleteProduct(${p.id})">🗑️</button></div></div></div>`;}).join('');}
function openProductModal(prod){editingId=prod?.id||null;document.getElementById('modalTitle').textContent=editingId?'✏️ Modifier':'➕ Ajouter';document.getElementById('pName').value=prod?.name||'';document.getElementById('pPrice').value=prod?.price||'';document.getElementById('pTab').value=prod?.tab||'laptops';document.getElementById('pCat').value=prod?.cat||'student';document.getElementById('pStock').value=prod?.stock||'';document.getElementById('pRating').value=prod?.rating||4.5;document.getElementById('pImg').value=prod?.img||'';document.getElementById('pSpecs').value=(prod?.specs||[]).join(', ');document.getElementById('pDesc').value=prod?.desc||'';document.getElementById('pCpu').value=prod?.cpu||'';document.getElementById('pBattery').value=prod?.battery||'';document.getElementById('pWarranty').value=prod?.warranty||1;document.getElementById('pColors').value=(prod?.colors||[]).join(', ');document.getElementById('productModal').classList.add('open');}
function closeProductModal(){document.getElementById('productModal').classList.remove('open');editingId=null;}
function saveProduct(){const prods=getProducts();const specs=document.getElementById('pSpecs').value.split(',').map(s=>s.trim()).filter(Boolean);const colors=document.getElementById('pColors').value.split(',').map(s=>s.trim()).filter(Boolean);const p={name:document.getElementById('pName').value.trim(),price:Number(document.getElementById('pPrice').value),tab:document.getElementById('pTab').value,cat:document.getElementById('pCat').value,stock:Number(document.getElementById('pStock').value),rating:Number(document.getElementById('pRating').value),img:document.getElementById('pImg').value.trim(),specs:specs.length?specs:['Standard'],desc:document.getElementById('pDesc').value.trim(),cpu:document.getElementById('pCpu').value.trim(),battery:document.getElementById('pBattery').value.trim(),warranty:Number(document.getElementById('pWarranty').value),colors:colors.length?colors:['Standard'],installment:true,reviews:0};if(!p.name||!p.price){showToast('⚠️','Nom et prix requis');return;}
if(editingId){const idx=prods.findIndex(x=>x.id===editingId);if(idx!==-1){prods[idx]={...prods[idx],...p};logActivity('✏️',`${p.name} modifié`);}}else{p.id=Math.max(...prods.map(x=>x.id),0)+1;prods.push(p);logActivity('➕',`${p.name} ajouté`);}
saveProducts(prods);closeProductModal();renderProducts();showToast('✅',`Produit ${editingId?'modifié':'ajouté'} !`);}
function editProduct(id){const p=getProducts().find(x=>x.id===id);if(p)openProductModal(p);}
function deleteProduct(id){if(!confirm(`Supprimer ${getProducts().find(x=>x.id===id)?.name||'ce produit'} ?`))return;const prods=getProducts().filter(x=>x.id!==id);saveProducts(prods);logActivity('🗑️',`Produit #${id} supprimé`);renderProducts();showToast('🗑️','Produit supprimé');}
function exportProductsCSV(){const p=getProducts();let c='ID,Nom,Catégorie,Prix,Stock,Note\\n';p.forEach(x=>{c+=`${x.id},"${x.name}",${x.tab},${x.price},${x.stock},${x.rating}\\n`;});downloadCSV(c,'produits_qn.csv');showToast('📥','Exporté');}

/* Charts */
function drawCharts(){drawRevenueChart();drawCategoryChart();}
function drawRevenueChart(){const canvas=document.getElementById('revenueChart');if(!canvas)return;const ctx=canvas.getContext('2d');const W=canvas.parentElement.offsetWidth-32;canvas.width=W;canvas.height=180;canvas.style.width=W+'px';
const days=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];const data=days.map(()=>Math.floor(100000+Math.random()*600000));const max=Math.max(...data);const barW=W/data.length*0.55;const gap=W/data.length*0.3;ctx.clearRect(0,0,W,180);
data.forEach((v,i)=>{const h=(v/max)*150;const x=i*(barW+gap)+gap/2;const grad=ctx.createLinearGradient(0,180-h,0,180);grad.addColorStop(0,'#0071e3');grad.addColorStop(1,'#5856d6');ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(x,180-h,barW,h,4);ctx.fill();
ctx.fillStyle='#7a7a82';ctx.font='9px Inter';ctx.textAlign='center';ctx.fillText((v/1000).toFixed(0)+'k',x+barW/2,165-h);ctx.fillText(days[i],x+barW/2,175);});}
function drawCategoryChart(){const canvas=document.getElementById('categoryChart');if(!canvas)return;const ctx=canvas.getContext('2d');const W=canvas.parentElement.offsetWidth-32;canvas.width=W;canvas.height=180;
const orders=getOrders();const catSales={laptops:0,phones:0,audio:0};orders.forEach(o=>o.items?.forEach(i=>{const p=getProducts().find(x=>x.name===i.name);if(p){catSales[p.tab]=(catSales[p.tab]||0)+i.qty;}}));
const labels={laptops:'PC Portables',phones:'Téléphones',audio:'Audio'};const colors=['#0071e3','#5856d6','#40e0d0'];const vals=Object.values(catSales);const total=vals.reduce((a,b)=>a+b,0);if(total===0){ctx.fillStyle='#7a7a82';ctx.font='12px Inter';ctx.textAlign='center';ctx.fillText('Pas encore de ventes',W/2,90);return;}
let start=0;const cx=W/2,cy=80,r=65;vals.forEach((v,i)=>{if(v===0)return;const a=(v/total)*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,start+a);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();start+=a;});
let lx=20;ctx.font='10px Inter';Object.entries(catSales).forEach(([k,v],i)=>{ctx.fillStyle=colors[i];ctx.fillRect(lx,168,8,8);ctx.fillStyle='#7a7a82';ctx.textAlign='left';const pct=total?Math.round(v/total*100):0;ctx.fillText(`${labels[k]} (${pct}%)`,lx+12,175);lx+=ctx.measureText(`${labels[k]} (${pct}%)`).width+20;});}

function renderDashboard(){const orders=getOrders();const p=getProducts();const tr=orders.reduce((s,o)=>s+(o.total||0),0);const pen=orders.filter(o=>o.status==='pending'||!o.status).length;const del=orders.filter(o=>o.status==='delivered').length;const days=7;const dailyRevenue=Math.round(tr/(days||1));
document.getElementById('dashStats').innerHTML=`<div class="stat-card"><div class="stat-label">💰 Revenu mensuel</div><div class="stat-value">${fmtDZD(tr)}</div><div class="stat-sub">${fmtDZD(dailyRevenue)}/jour</div></div><div class="stat-card"><div class="stat-label">📦 Commandes</div><div class="stat-value">${orders.length}</div><div class="stat-sub">${pen} attente • ${del} livrées</div></div><div class="stat-card"><div class="stat-label">🏆 Meilleur vendeur</div><div class="stat-value">${orders.length>0?'Pro 16"':'—'}</div></div><div class="stat-card"><div class="stat-label">💻 Produits</div><div class="stat-value">${p.length}</div><div class="stat-sub">${p.filter(x=>x.stock<=5).length} stock bas</div></div>`;renderActivity();drawCharts();}

function renderAnalytics(){
const orders=getOrders();
const rev=orders.reduce((s,o)=>s+(o.total||0),0);
const cnt=orders.length;
const cats={};
orders.forEach(o=>o.items?.forEach(i=>{cats[i.name||'Inconnu']=(cats[i.name||'Inconnu']||0)+i.qty;}));
const sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
const unique=orders.filter((o,i,a)=>a.findIndex(x=>x.id===o.id)===i).length;
document.getElementById('analyticsStats').innerHTML=`<div class="stat-card"><div class="stat-label">💰 Revenu total</div><div class="stat-value">${fmtDZD(rev)}</div></div><div class="stat-card"><div class="stat-label">📦 Commandes</div><div class="stat-value">${cnt}</div></div><div class="stat-card"><div class="stat-label">📊 Panier moyen</div><div class="stat-value">${cnt?fmtDZD(Math.round(rev/cnt)):0}</div></div>`;
const tableHtml = sorted.length
  ? '<table><tr><th>#</th><th>Produit</th><th>Qté</th><th>Revenu</th></tr>' +
    sorted.slice(0,10).map(([n,q],i)=>{const pp=getProducts().find(x=>x.name===n);return '<tr><td>'+(i+1)+'</td><td>'+n+'</td><td>'+q+'</td><td style="color:var(--accent);font-weight:600;">'+(pp?fmtDZD(pp.price*q):fmtDZD(0))+'</td></tr>';}).join('') +
    '</table>'
  : '<p style="color:var(--text-muted);font-size:0.75rem;">Pas encore de données</p>';
document.getElementById('customerInsights').innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;"><div style="background:var(--surface-alt);padding:0.8rem;border-radius:10px;"><div style="font-size:0.6rem;color:var(--text-muted);text-transform:uppercase;">👥 Clients</div><div style="font-size:1.5rem;font-weight:700;color:var(--accent);">${unique||cnt}</div></div><div style="background:var(--surface-alt);padding:0.8rem;border-radius:10px;"><div style="font-size:0.6rem;color:var(--text-muted);text-transform:uppercase;">🛒 Commandes</div><div style="font-size:1.5rem;font-weight:700;color:var(--accent2);">${cnt}</div></div><div style="background:var(--surface-alt);padding:0.8rem;border-radius:10px;"><div style="font-size:0.6rem;color:var(--text-muted);text-transform:uppercase;">📈 Revenu/client</div><div style="font-size:1.5rem;font-weight:700;color:var(--green);">${unique?fmtDZD(Math.round(rev/unique)):'0'}</div></div></div><h4 style="font-size:0.8rem;font-weight:600;margin:1rem 0 0.5rem;">🏆 Produits les plus vendus</h4>${tableHtml}`;
}

function downloadCSV(c,name){const b=new Blob(['\\ufeff'+c],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeProductModal();});

function initDashboard(){const o=getOrders();if(!o.length){const samples=[{id:'QT-2026-1001',items:[{name:'QuantumBook Pro 16"',qty:1,price:495000}],total:495000,date:new Date(Date.now()-86400000*2).toISOString(),status:'delivered'},{id:'QT-2026-1002',items:[{name:'QuantumPhone 15 Pro',qty:1,price:225000}],total:225000,date:new Date(Date.now()-86400000).toISOString(),status:'shipped'},{id:'QT-2026-1003',items:[{name:'QuantumPods Pro',qty:2,price:52000}],total:104000,date:new Date().toISOString(),status:'pending'},];saveOrders(samples);logActivity('🚀','Données de démo initialisées');}
logActivity('👤','Connexion admin');renderDashboard();renderOrders();renderProducts();renderAnalytics();}
</script>
